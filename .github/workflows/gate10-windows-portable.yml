name: Gate 10 Windows portable EXE (manual validation)

on:
  workflow_dispatch:
  pull_request:
    paths:
      - scripts/build-face-impact-windows.ps1
      - ui/electron/main.js
      - ui/electron/backendProcess.js
      - ui/electron/backendProcess.test.js
      - ui/vite.config.ts
      - ui/src/utils/serverOrigin.ts
      - tests/windows_packaged_smoke.ps1
      - .github/workflows/gate10-windows-portable.yml

jobs:
  portable-exe:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: '.node-version'
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Test Electron backend lifecycle helpers
        working-directory: ui
        run: npm run test:electron
      - name: Build portable EXE
        shell: pwsh
        run: ./scripts/build-face-impact-windows.ps1
      - name: Validate bundle structure
        shell: pwsh
        run: |
          $bundle = 'out/OpenFlight-Face-Impact-Windows'
          if (!(Test-Path "$bundle/OpenFlight Face Impact.exe")) { throw 'Missing EXE' }
          if (!(Test-Path "$bundle/resources/app/dist/index.html")) { throw 'Missing UI' }
          if (!(Test-Path "$bundle/resources/app/electron/main.js")) { throw 'Missing Electron main' }
          if (!(Test-Path "$bundle/resources/app/electron/backendProcess.js")) { throw 'Missing backend process module' }
          Write-Host 'Bundle file structure verified (not a GUI runtime or hardware test).'
      - name: Gate 11 packaged EXE renderer smoke
        shell: pwsh
        run: ./tests/windows_packaged_smoke.ps1 -EvidenceDirectory "$env:RUNNER_TEMP/gate11"
      - name: Upload Gate 11 screenshot evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gate11-windows-dashboard-screenshot
          path: |
            ${{ runner.temp }}/gate11/dashboard-*.png
            ${{ runner.temp }}/gate11/result-*.json
          if-no-files-found: warn
      - name: Upload development-only portable bundle
        uses: actions/upload-artifact@v7
        with:
          name: gate10-windows-portable-development-only
          path: out/OpenFlight-Face-Impact-Windows
          if-no-files-found: error
