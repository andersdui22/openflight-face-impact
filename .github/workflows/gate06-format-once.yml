name: Gate 06 one-time dashboard formatting

on:
  push:
    branches:
      - mdp-v1.2/phase2-gate06-dashboard
    paths:
      - .github/workflows/gate06-format-once.yml

permissions:
  contents: write

jobs:
  format-approved-dashboard-files:
    if: github.repository == 'andersdui22/openflight-face-impact' && github.ref == 'refs/heads/mdp-v1.2/phase2-gate06-dashboard'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Install pinned UI dependencies
        working-directory: ui
        run: npm ci
      - name: Format exactly the two approved files
        working-directory: ui
        run: npx --no-install prettier --write src/App.tsx src/components/panel/panel.css
      - name: Assert only approved paths changed
        shell: bash
        run: |
          set -euo pipefail
          git diff --name-only > /tmp/gate06-changed.txt
          while IFS= read -r path; do
            case "$path" in
              ui/src/App.tsx|ui/src/components/panel/panel.css) ;;
              *) echo "OUT-OF-SCOPE CHANGE: $path"; exit 1 ;;
            esac
          done < /tmp/gate06-changed.txt
          if [[ ! -s /tmp/gate06-changed.txt ]]; then
            echo "No formatting changes required"
          fi
      - name: Verify Prettier against the entire UI source
        working-directory: ui
        run: npm run format:check
      - name: Commit approved formatting only to Gate 06 branch
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- ui/src/App.tsx ui/src/components/panel/panel.css; then
            echo "Already formatted"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- ui/src/App.tsx ui/src/components/panel/panel.css
          git diff --cached --name-only | while IFS= read -r path; do
            case "$path" in
              ui/src/App.tsx|ui/src/components/panel/panel.css) ;;
              *) echo "OUT-OF-SCOPE STAGED CHANGE: $path"; exit 1 ;;
            esac
          done
          git commit -m "style(gate06): apply pinned Prettier to dashboard files"
          git push origin HEAD:refs/heads/mdp-v1.2/phase2-gate06-dashboard
