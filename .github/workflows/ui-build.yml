name: UI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: ".node-version"
          cache: "npm"
          cache-dependency-path: ui/package-lock.json
      - name: Install dependencies
        run: npm ci
        working-directory: ui
      - name: Build
        run: npm run build
        working-directory: ui

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: ".node-version"
          cache: "npm"
          cache-dependency-path: ui/package-lock.json
      - name: Install dependencies
        run: npm ci
        working-directory: ui
      - name: Lint
        run: npm run lint
        working-directory: ui

  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: ".node-version"
          cache: "npm"
          cache-dependency-path: ui/package-lock.json
      - name: Install dependencies
        run: npm ci
        working-directory: ui
      - name: Check formatting and show exact Gate 13 diff on failure
        working-directory: ui
        run: |
          if ! npm run format:check; then
            npx prettier src/App.tsx > /tmp/gate13-app-prettier.tsx
            diff -u src/App.tsx /tmp/gate13-app-prettier.tsx || true
            exit 1
          fi

  e2e:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Set up uv
        uses: astral-sh/setup-uv@v7
      - name: Install backend dependencies
        run: uv sync --python 3.12
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: ".node-version"
          cache: "npm"
          cache-dependency-path: ui/package-lock.json
      - name: Install dependencies
        run: npm ci
        working-directory: ui
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
        working-directory: ui
      - name: Run E2E tests
        run: npm run test:e2e
        working-directory: ui
      - name: Upload Playwright artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-artifacts
          path: |
            ui/playwright-report
            ui/test-results
          if-no-files-found: ignore
      - name: Publish Gate 03 browser screenshot to PR branch
        if: ${{ success() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'gate03/windows-elp-camera' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          screenshot="$(find ui/playwright-report/data -type f -name '*.png' | head -n 1)"
          test -n "$screenshot"
          cp "$screenshot" /tmp/gate03-usb-status-playwright.png
          git fetch origin gate03/windows-elp-camera
          git checkout -B gate03/windows-elp-camera origin/gate03/windows-elp-camera
          mkdir -p docs/evidence
          if test -f docs/evidence/gate03-usb-status-playwright.png; then
            echo 'Verified screenshot already committed; avoiding recursive bot commits.'
            exit 0
          fi
          cp /tmp/gate03-usb-status-playwright.png docs/evidence/gate03-usb-status-playwright.png
          git add docs/evidence/gate03-usb-status-playwright.png
          if ! git diff --cached --quiet; then
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'docs(gate03): attach genuine Playwright USB-status screenshot'
            git push origin HEAD:gate03/windows-elp-camera
          fi
