name: Face Impact Windows USB camera

on:
  pull_request:
    paths:
      - src/openflight/camera/windows_usb.py
      - tests/test_windows_usb_camera.py tests/test_windows_usb_server.py
      - tests/test_windows_usb_server.py
      - src/openflight/server.py
      - .github/workflows/face-impact-windows-camera.yml
      - docs/governance/GATE03_WINDOWS_ELP_CAMERA.md
  workflow_dispatch:

permissions:
  contents: read

jobs:
  usb-camera-fixtures:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install backend and test runner
        run: python -m pip install -e . pytest
      - name: Hardware-free USB camera acquisition tests
        run: python -m pytest -q tests/test_windows_usb_camera.py
