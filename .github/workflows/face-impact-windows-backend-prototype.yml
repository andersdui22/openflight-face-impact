name: Face Impact Windows Python backend prototype

on:
  workflow_dispatch:
  pull_request:
    paths:
      - scripts/build-face-impact-backend-windows.ps1
      - scripts/build-face-impact-windows.ps1
      - scripts/face-impact-backend-entry.py
      - tests/windows_packaged_smoke.ps1
      - ui/electron/main.js
      - ui/electron/backendProcess.js
      - ui/src/utils/serverOrigin.ts
      - .github/workflows/face-impact-windows-backend-prototype.yml

permissions:
  contents: read

jobs:
  backend-prototype:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Build development-only backend EXE
        shell: pwsh
        run: ./scripts/build-face-impact-backend-windows.ps1
      - name: Verify backend health over loopback
        shell: pwsh
        run: |
          $exe = Resolve-Path 'out/face-impact-backend/OpenFlightFaceImpactBackend/OpenFlightFaceImpactBackend.exe'
          $stdout = Join-Path $env:RUNNER_TEMP 'backend-stdout.log'
          $stderr = Join-Path $env:RUNNER_TEMP 'backend-stderr.log'
          $process = Start-Process -FilePath $exe -ArgumentList @('--mock','--host','127.0.0.1','--web-port','8080','--no-logging') -PassThru -WindowStyle Hidden -RedirectStandardOutput $stdout -RedirectStandardError $stderr
          try {
            $healthy = $false
            for ($attempt = 0; $attempt -lt 40; $attempt++) {
              if ($process.HasExited) { throw "Backend exited prematurely: $($process.ExitCode)" }
              try {
                $response = Invoke-RestMethod -Uri 'http://127.0.0.1:8080/api/face-impact/health' -TimeoutSec 2
                if ($response.service -eq 'openflight-face-impact' -and $response.protocol_version -eq 1 -and $response.status -eq 'ready' -and $response.camera_validated -eq $false) {
                  $healthy = $true
                  break
                }
              } catch { Start-Sleep -Milliseconds 500 }
            }
            if (!$healthy) { throw 'Backend health identity was not verified' }
            Write-Host 'Packaged Python mock backend health identity verified.'
          } finally {
            if (!$process.HasExited) {
              Stop-Process -Id $process.Id -Force
              if (!$process.WaitForExit(10000)) { throw 'Standalone mock backend did not exit' }
            }
            if (Test-Path $stdout) { Write-Host 'Backend stdout:'; Get-Content $stdout -Tail 100 }
            if (Test-Path $stderr) { Write-Host 'Backend stderr:'; Get-Content $stderr -Tail 100 }
          }
      - name: Upload backend startup diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: face-impact-backend-startup-diagnostics
          path: |
            ${{ runner.temp }}/backend-stdout.log
            ${{ runner.temp }}/backend-stderr.log
          if-no-files-found: warn
      - name: Validate staged portable Electron bundle
        shell: pwsh
        run: |
          $env:OPENFLIGHT_BACKEND_BUILD_EXE = (Resolve-Path 'out/face-impact-backend/OpenFlightFaceImpactBackend/OpenFlightFaceImpactBackend.exe').Path
          ./scripts/build-face-impact-windows.ps1
          if (!(Test-Path 'out/OpenFlight-Face-Impact-Windows/resources/backend/OpenFlightFaceImpactBackend.exe')) {
            throw 'Packaged Electron resources missing Python backend executable'
          }
          if (!(Test-Path 'out/OpenFlight-Face-Impact-Windows/resources/backend/_internal' -PathType Container)) {
            throw 'Packaged Electron resources missing Python backend dependencies'
          }
      - name: Verify packaged connection, shutdown, backend loss and archive recovery
        shell: pwsh
        run: ./tests/windows_packaged_smoke.ps1 -WithBackend -EvidenceDirectory "$env:RUNNER_TEMP/packaged-backend"
      - name: Upload packaged Electron renderer evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: packaged-windows-mock-dashboard
          path: |
            ${{ runner.temp }}/packaged-backend/dashboard-*.png
            ${{ runner.temp }}/packaged-backend/result-*.json
            ${{ runner.temp }}/packaged-backend/exported-session-*.json
          if-no-files-found: warn
      - name: Upload development-only backend folder
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: face-impact-python-backend-prototype
          path: out/face-impact-backend/OpenFlightFaceImpactBackend/
          if-no-files-found: error
      - name: Upload development-only Electron bundle with staged mock backend
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: face-impact-windows-portable-with-mock-backend
          path: out/OpenFlight-Face-Impact-Windows/
          if-no-files-found: error
