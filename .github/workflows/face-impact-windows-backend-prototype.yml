name: Face Impact Windows Python backend prototype

on:
  workflow_dispatch:
  pull_request:
    paths:
      - scripts/build-face-impact-backend-windows.ps1
      - scripts/face-impact-backend-entry.py
      - .github/workflows/face-impact-windows-backend-prototype.yml

permissions:
  contents: read

jobs:
  backend-prototype:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Build development-only backend EXE
        shell: pwsh
        run: ./scripts/build-face-impact-backend-windows.ps1
      - name: Verify backend health over loopback
        shell: pwsh
        run: |
          $exe = Resolve-Path 'out/face-impact-backend/OpenFlightFaceImpactBackend.exe'
          $stdout = Join-Path $env:RUNNER_TEMP 'backend-stdout.log'
          $stderr = Join-Path $env:RUNNER_TEMP 'backend-stderr.log'
          $process = Start-Process -FilePath $exe -ArgumentList @('--mock','--host','127.0.0.1','--web-port','8080','--no-logging') -PassThru -WindowStyle Hidden -RedirectStandardOutput $stdout -RedirectStandardError $stderr
          try {
            $healthy = $false
            for ($attempt = 0; $attempt -lt 40; $attempt++) {
              if ($process.HasExited) { throw "Backend exited prematurely: $($process.ExitCode)" }
              try {
                $response = Invoke-RestMethod -Uri 'http://127.0.0.1:8080/api/face-impact/health' -TimeoutSec 2
                if ($response.service -eq 'openflight-face-impact' -and $response.protocol_version -eq 1 -and $response.status -eq 'ready' -and $response.camera_validated -eq $false) {
                  $healthy = $true
                  break
                }
              } catch { Start-Sleep -Milliseconds 500 }
            }
            if (!$healthy) { throw 'Backend health identity was not verified' }
            Write-Host 'Packaged Python mock backend health identity verified.'
          } finally {
            if (!$process.HasExited) { Stop-Process -Id $process.Id -Force }
            if (Test-Path $stdout) { Write-Host 'Backend stdout:'; Get-Content $stdout -Tail 100 }
            if (Test-Path $stderr) { Write-Host 'Backend stderr:'; Get-Content $stderr -Tail 100 }
          }
      - name: Upload backend startup diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: face-impact-backend-startup-diagnostics
          path: |
            ${{ runner.temp }}/backend-stdout.log
            ${{ runner.temp }}/backend-stderr.log
          if-no-files-found: warn
      - name: Validate staged portable Electron bundle
        shell: pwsh
        run: |
          $env:OPENFLIGHT_BACKEND_BUILD_EXE = (Resolve-Path 'out/face-impact-backend/OpenFlightFaceImpactBackend.exe').Path
          ./scripts/build-face-impact-windows.ps1
          if (!(Test-Path 'out/OpenFlight-Face-Impact-Windows/resources/backend/OpenFlightFaceImpactBackend.exe')) {
            throw 'Packaged Electron resources missing Python backend executable'
          }
          Write-Host 'Electron portable bundle includes the Python backend (not a hardware test).'
      - name: Upload development-only backend executable
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: face-impact-python-backend-prototype
          path: out/face-impact-backend/OpenFlightFaceImpactBackend.exe
          if-no-files-found: error
