name: Face Impact Windows bootstrap

on:
  pull_request:
    paths:
      - scripts/windows-bootstrap.mjs
      - tests/windows-bootstrap.test.mjs
      - tests/windows_backend_smoke.py
      - tests/windows_full_bootstrap_smoke.py
      - pyproject.toml
      - .github/workflows/face-impact-windows-bootstrap.yml
      - docs/governance/GATE02_WINDOWS_BOOTSTRAP.md
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bootstrap-unit:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
      - name: Launcher syntax and unit tests
        run: |
          node --check scripts/windows-bootstrap.mjs
          node --test tests/windows-bootstrap.test.mjs
      - uses: actions/setup-python@v6
        if: matrix.os == 'windows-latest'
        with:
          python-version: '3.12'
      - name: Install inherited Python backend on Windows
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: python -m pip install -e .
      - name: Verify Python backend CLI imports on Windows
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: python -m openflight.server --help
      - name: Start real mock Flask backend on Windows
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: python tests/windows_backend_smoke.py
      - name: Verify existing React production build on Windows
        if: matrix.os == 'windows-latest'
        working-directory: ui
        run: |
          npm ci
          npm run build
      - name: Combined Flask + Electron Windows startup smoke
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: python tests/windows_full_bootstrap_smoke.py
